<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/family-dashboard.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#345c52" />
    <title>Familien-Dashboard</title>
  </head>
  <body>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('familien-dashboard-theme') || 'light'
          const allowed = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light'
          const systemDark = matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = allowed === 'system' ? (systemDark ? 'dark' : 'light') : allowed
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
